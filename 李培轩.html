<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人名片 · 简约信息展示</title>
  <!-- 使用柔和的系统字体与优雅配色 -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f7f9fc 0%, #e9edf4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
    }

    /* 主卡片 – 玻璃拟态 */
    .profile-card {
      max-width: 700px;
      width: 100%;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 3.5rem;
      padding: 2.8rem 2.5rem;
      box-shadow: 0 30px 60px -20px rgba(0, 20, 40, 0.25),
                  0 8px 20px rgba(0, 0, 0, 0.02),
                  inset 0 1px 1px rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: transform 0.25s ease, box-shadow 0.3s ease;
    }

    .profile-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 40px 70px -18px rgba(0, 20, 40, 0.3);
    }

    /* 头像区域 – 带柔和光晕 */
    .avatar-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 1.8rem;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b3f5c, #2a2d44);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.8rem;
      font-weight: 400;
      color: #f0f3fa;
      box-shadow: 0 12px 28px -6px rgba(30, 40, 70, 0.25),
                  inset 0 -2px 0 rgba(0,0,0,0.05);
      border: 3px solid rgba(255, 255, 255, 0.7);
      transition: transform 0.2s ease;
      user-select: none;
    }

    .avatar:hover {
      transform: scale(1.02);
    }

    /* 姓名 + 标题 */
    .name-title {
      text-align: center;
      margin-bottom: 1.2rem;
    }

    .name {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #1a1e2b;
      margin-bottom: 0.2rem;
      line-height: 1.2;
    }

    .badge {
      display: inline-block;
      background: rgba(60, 70, 100, 0.12);
      backdrop-filter: blur(2px);
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #2f3650;
      border: 1px solid rgba(255, 255, 255, 0.3);
      letter-spacing: 0.3px;
      margin-top: 4px;
    }

    /* 分隔装饰 */
    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #7e8aa8, #b0bcd9);
      margin: 1.4rem auto 1.8rem auto;
      border-radius: 20px;
      opacity: 0.5;
    }

    /* 简介段落 – 更易读 */
    .bio {
      text-align: center;
      font-size: 1.08rem;
      line-height: 1.7;
      color: #2a3042;
      background: rgba(255, 255, 255, 0.3);
      padding: 0.8rem 1.4rem;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      margin-bottom: 2.2rem;
      font-weight: 420;
      letter-spacing: 0.2px;
      word-break: break-word;
    }

    /* 信息网格 – 清晰展示联系方式等 */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem 1.2rem;
      background: rgba(245, 248, 255, 0.3);
      backdrop-filter: blur(4px);
      border-radius: 2.5rem;
      padding: 1.5rem 1.8rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      margin-bottom: 2.2rem;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0.2rem;
      border-bottom: 1px solid rgba(150, 165, 195, 0.15);
    }

    .info-item:last-child,
    .info-item:nth-last-child(2) {
      border-bottom: none;
    }

    .info-icon {
      font-size: 1.3rem;
      width: 1.8rem;
      text-align: center;
      flex-shrink: 0;
      color: #38405a;
    }

    .info-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #4b5677;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      min-width: 48px;
    }

    .info-value {
      font-size: 1rem;
      font-weight: 480;
      color: #141a2b;
      word-break: break-word;
      transition: color 0.2s;
    }

    .info-value a {
      color: #2f3d6b;
      text-decoration: none;
      border-bottom: 1px dotted rgba(50, 70, 120, 0.2);
      transition: border-color 0.2s, color 0.2s;
    }

    .info-value a:hover {
      color: #1b2747;
      border-bottom-color: #2f3d6b;
    }

    /* 社交链接 – 精致图标按钮 */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 0.2rem;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(6px);
      padding: 0.6rem 1.4rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
      font-size: 0.95rem;
      font-weight: 500;
      color: #1f2842;
      text-decoration: none;
      transition: all 0.2s ease;
      letter-spacing: 0.2px;
      cursor: pointer;
    }

    .social-btn:hover {
      background: #ffffffcc;
      border-color: #bcc6dd;
      box-shadow: 0 8px 18px -6px rgba(30, 40, 70, 0.15);
      transform: translateY(-2px);
      color: #101624;
    }

    .social-btn .emoji-icon {
      font-size: 1.2rem;
      line-height: 1;
    }

    /* 响应式适配 – 小屏优化 */
    @media (max-width: 550px) {
      .profile-card {
        padding: 2rem 1.2rem;
        border-radius: 2.5rem;
      }

      .name {
        font-size: 2rem;
      }

      .info-grid {
        grid-template-columns: 1fr;
        gap: 0.2rem;
        padding: 1.2rem 1.2rem;
        border-radius: 2rem;
      }

      .info-item {
        padding: 0.45rem 0;
        border-bottom: 1px solid rgba(150, 165, 195, 0.15);
      }

      .info-item:nth-last-child(2) {
        border-bottom: 1px solid rgba(150, 165, 195, 0.15);
      }

      .info-item:last-child {
        border-bottom: none;
      }

      .bio {
        font-size: 0.98rem;
        padding: 0.6rem 1rem;
        border-radius: 40px;
      }

      .social-btn {
        padding: 0.5rem 1.2rem;
        font-size: 0.85rem;
      }

      .avatar {
        width: 100px;
        height: 100px;
        font-size: 3.2rem;
      }
    }

    @media (max-width: 400px) {
      .profile-card {
        padding: 1.5rem 0.9rem;
      }
      .info-grid {
        padding: 1rem 0.8rem;
      }
      .social-btn {
        padding: 0.4rem 1rem;
      }
    }

    /* 小点缀 – 增加细节趣味 */
    .footer-note {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.7rem;
      color: #5b688b;
      letter-spacing: 0.4px;
      opacity: 0.5;
    }

    /* 自定义滚动 (优雅) */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(200, 210, 230, 0.2);
      border-radius: 20px;
    }
    ::-webkit-scrollbar-thumb {
      background: #a5b3cf;
      border-radius: 20px;
    }
  </style>
</head>
